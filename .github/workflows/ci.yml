name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run these checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the published package starts
        run: |
          npm pack
          tarball=$(ls octopusthink-app-store-connect-mcp-*.tgz)
          node -e "
            const { spawn } = require('node:child_process');
            const child = spawn('npx', ['-y', './$tarball'], { stdio: ['pipe', 'pipe', 'inherit'] });
            child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-11-25', capabilities: {}, clientInfo: { name: 'ci', version: '0' } } }) + '\n');
            child.stdout.on('data', (data) => { console.log(String(data)); child.kill(); process.exit(String(data).includes('app-store-connect') ? 0 : 1); });
            setTimeout(() => { console.error('No initialize response'); process.exit(1); }, 60000);
          "
