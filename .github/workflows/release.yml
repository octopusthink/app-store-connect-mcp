name: Release

# Publishes to npm when a version tag such as 1.2.3 is pushed.
# Create one with `npm version patch|minor|major` and `git push --follow-tags`
# (.npmrc sets tag-version-prefix="" so npm doesn't add a "v").
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to gate releases.
    environment: npm
    permissions:
      contents: read
      # Lets npm authenticate with GitHub's OIDC token (trusted publishing), so no npm token is stored here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which current Node 24 releases include.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version ($version). Tag $version instead."
            exit 1
          fi
      # prepublishOnly runs lint, typecheck, tests and the build before anything is uploaded.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            # Prereleases such as 1.2.0-beta.1 go to the "next" dist-tag so `npx` users keep getting the stable release.
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
